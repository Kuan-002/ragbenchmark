<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperPilot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
        PaperPilot
      </div>
      <nav style="display:flex;gap:4px;align-items:center;">
        <a href="/" data-i18n="nav.upload" style="font-size:13px;color:#2563eb;font-weight:600;text-decoration:none;padding:4px 10px;border-radius:6px;background:#eff6ff;"></a>
        <a href="/library" data-i18n="nav.library" style="font-size:13px;color:#4b5563;text-decoration:none;padding:4px 10px;border-radius:6px;transition:background .15s;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background=''"></a>
        <button id="lang-toggle" onclick="toggleLang()" style="font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;border:1px solid #d1d5db;background:#fff;cursor:pointer;color:#374151;margin-left:4px;"></button>
      </nav>
      <div id="mode-toggle" class="mode-toggle hidden">
        <span class="mode-label" data-i18n="mode.label"></span>
        <button id="btn-ce"  class="mode-btn active" onclick="setMode('ce')"  data-i18n="mode.ce"></button>
        <button id="btn-rrf" class="mode-btn"         onclick="setMode('rrf')" data-i18n="mode.rrf"></button>
      </div>
    </div>
  </header>

  <!-- Upload screen -->
  <div id="upload-screen" class="screen">
    <div class="upload-card">
      <h1 data-i18n="upload.title"></h1>
      <p class="subtitle" data-i18n="upload.subtitle"></p>

      <div class="tab-bar">
        <button class="tab active" onclick="switchTab('pdf')"   data-i18n="upload.tabPdf"></button>
        <button class="tab"        onclick="switchTab('arxiv')" data-i18n="upload.tabArxiv"></button>
      </div>

      <!-- PDF upload -->
      <div id="tab-pdf" class="tab-panel">
        <div id="drop-zone" class="drop-zone" onclick="document.getElementById('file-input').click()">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p data-i18n="upload.dropHint"></p>
          <span class="hint-text" data-i18n="upload.dropSub"></span>
          <input type="file" id="file-input" accept=".pdf" style="display:none" onchange="handleFileSelect(event)" />
        </div>
      </div>

      <!-- arXiv import -->
      <div id="tab-arxiv" class="tab-panel hidden">
        <div class="arxiv-form">
          <input type="text" id="arxiv-input" data-i18n-placeholder="upload.arxivPlaceholder" />
          <button class="btn-primary" onclick="handleArxiv()" data-i18n="upload.arxivBtn"></button>
        </div>
      </div>

      <div id="upload-status" class="upload-status hidden"></div>

      <!-- Demo papers -->
      <div id="demo-section" class="demo-section hidden">
        <div class="demo-divider"><span data-i18n="demo.label"></span></div>
        <div id="demo-list" class="demo-list"></div>
      </div>
    </div>
  </div>

  <!-- Main Q&A screen -->
  <div id="main-screen" class="screen hidden">
    <div class="main-layout">
      <!-- Left: paper info -->
      <aside class="paper-panel">
        <div class="paper-meta">
          <div class="paper-badge" data-i18n="paper.loaded"></div>
          <h2 id="paper-title"></h2>
          <p id="paper-abstract" class="abstract-text"></p>
        </div>
        <div class="section-list">
          <h3 data-i18n="paper.sections"></h3>
          <ul id="section-list"></ul>
        </div>
        <button class="btn-secondary" onclick="resetApp()" data-i18n="paper.change"></button>
      </aside>

      <!-- Right: Q&A -->
      <main class="qa-panel">
        <div id="qa-history" class="qa-history"></div>

        <div class="qa-input-area">
          <textarea id="question-input" rows="2" data-i18n-placeholder="qa.placeholder"
            onkeydown="handleKey(event)"></textarea>
          <button class="btn-primary send-btn" onclick="submitQuestion()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="input-hint" data-i18n="qa.hint"></p>
      </main>
    </div>
  </div>

  <!-- Feedback modal -->
  <div id="feedback-modal" class="modal hidden">
    <div class="modal-card">
      <h3 data-i18n="feedback.title"></h3>
      <p class="modal-desc" data-i18n="feedback.desc"></p>
      <div class="modal-btns">
        <button class="btn-modal" onclick="submitFailure('retrieval_failure')">
          <strong data-i18n="feedback.irrelevant"></strong>
          <span data-i18n="feedback.irrelevantDesc"></span>
        </button>
        <button class="btn-modal" onclick="submitFailure('missing_evidence')">
          <strong data-i18n="feedback.incomplete"></strong>
          <span data-i18n="feedback.incompleteDesc"></span>
        </button>
      </div>
      <button class="btn-text" onclick="closeModal()" data-i18n="feedback.skip"></button>
    </div>
  </div>
  <div id="modal-backdrop" class="modal-backdrop hidden" onclick="closeModal()"></div>

  <script src="/static/app.js"></script>
  <script>
    function renderMath(el) {
      if (typeof renderMathInElement === 'undefined') return;
      renderMathInElement(el, {
        delimiters: [
          { left: '$$', right: '$$', display: true  },
          { left: '$',  right: '$',  display: false },
        ],
        throwOnError: false,
        errorColor: '#9ca3af',
      });
    }
  </script>
</body>
</html>
